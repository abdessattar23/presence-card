name: build windows exe

on:
  workflow_dispatch:        # build on demand (Actions tab → Run workflow)
  push:
    tags: ["v*"]            # on a release tag, build and attach the exe

permissions:
  contents: write           # needed to upload to the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build presence.exe
        run: powershell -ExecutionPolicy Bypass -File windows\build.ps1

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: presence-exe
          path: windows/dist/presence.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/presence.exe
