  <g fill="#e8b13c">
    <rect x="51" y="51" width="154" height="154"/>
    <rect x="51" y="51" width="154" height="154" transform="rotate(45 128 128)"/>
  </g>
  <g fill="#0e2348">
    <rect x="86" y="86" width="84" height="84"/>
    <rect x="86" y="86" width="84" height="84" transform="rotate(45 128 128)"/>
  </g>
  <circle cx="128" cy="128" r="22" fill="#39ff9e"/>
</svg>
